<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
<title>Tic-Tac-Toe</title>
<style>
table, button, td {
  border:5px solid black;
    border-collapse: collapse;
  background-color:lightblue;
  color: black;
  font-size: 20vw;
}
body {
text-align: center;
background-color: black;
color: white;
height: 100%;
}

body {
  color: white;
  background: #ededed;
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.3;
  margin: 0;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

canvas {
  border: 1px solid silver;
  background: white;
    cursor: -webkit-grab;
  display: block;
}


</style>
<script src="tic-tac-toe.js" defer></script>

</head>
<body>

<h1>Tic-Tac-Toe</h1>
<p id="status" role="status">Status message</p>

<table id="board" style="widbutton:100%; height: 250px; text-align:center;">
  <tr id="row1">
    <td><button id="cell1" data-cell="0" aria-label="Square 1, empty" disabled>&#128938</button></td>
    <td><button id="cell2" data-cell="1" aria-label="Square 2, empty" disabled>&#128938</button></td>
    <td><button id="cell3" data-cell="2" aria-label="Square 3, empty" disabled>&#128938</button></td>
  </tr>
  <tr id="row2">
    <td><button id="cell4" data-cell="3" aria-label="Square 4, empty" disabled>&#128902</button></td>
    <td><button id="cell5" data-cell="4" aria-label="Square 5, empty" disabled>&#128902</button></td>
    <td><button id="cell6" data-cell="5" aria-label="Square 6, empty" disabled>&#128902</button></td>
  </tr>
  <tr id="row3">
    <td><button id="cell7" data-cell="6" aria-label="Square 7, empty" disabled>&#128938</button></td>
    <td><button id="cell8" data-cell="7" aria-label="Square 8, empty" disabled>&#128938</button></td>
    <td><button id="cell9" data-cell="8" aria-label="Square 9, empty" disabled>&#128938</button></td>
  </tr>
</table>


<script id="win_confetti" type="text/plain">
let nouvelle,
  ancienne,
  pression;

let themeCouleur = [
  '#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5',
  '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50',
  '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800',
  '#FF5722'
];
class Particule {
  constructor(parent) {
    this.parent = parent;
    this.gravite = parent.gravite;
    this.reinit();
    this.forme = round(random(0, 1));
    this.etape = 0;
    this.prise = 0;
    this.priseFacteur = random(-0.02, 0.02);
    this.multFacteur = random(0.01, 0.08);
    this.priseAngle = 0;
    this.priseVitesse = 0.05;
  }
  reinit() {
    this.position = this.parent.position.copy();
    this.position.y = random(-20, -100);
    this.position.x = random(0, width);
    this.velocite = createVector(random(-6, 6), random(-10, 2));
    this.friction = random(0.995, 0.98);
    this.taille = round(random(5, 15));
    this.moitie = this.taille / 2;
    this.couleur = color(random(themeCouleur));
  }
  dessiner() {
    this.etape = 0.5 + Math.sin(this.velocite.y * 20) * 0.5;
    this.prise = this.priseFacteur + Math.cos(this.priseAngle) * this.multFacteur;
    this.priseAngle += this.priseVitesse;
    translate(this.position.x, this.position.y);
    rotate(this.velocite.x * 2);
    scale(1, this.etape);
    noStroke();
    fill(this.couleur);

    if (this.forme === 0) {
      rect(-this.moitie, -this.moitie, this.taille, this.taille);
    } else {
      ellipse(0, 0, this.taille, this.taille);
    }

    resetMatrix();
  }
  integration() {
    this.velocite.add(this.gravite);
    this.velocite.x += this.prise;
    this.velocite.mult(this.friction);
    this.position.add(this.velocite);
    if (this.position.y > height) {
      this.reinit();
    }

    if (this.position.x < 0) {
      this.reinit();
    }
    if (this.position.x > width + 10) {
      this.reinit();
    }
  }
  rendu() {
    this.integration();
    this.dessiner();
  }
}
class SystemeDeParticules {
  constructor(nombreMax, position, gravite) {
    this.position = position.copy();
    this.nombreMax = nombreMax;
    this.gravite = createVector(0, 0.1);
    this.friction = 0.98;
    this.particules = [];
    for (var i = 0; i < this.nombreMax; i++) {
      this.particules.push(new Particule(this));
    }
  }
  rendu() {
    if (pression) {
      var force = p5.Vector.sub(nouvelle, ancienne);
      this.gravite.x = force.x / 20;
      this.gravite.y = force.y / 20;
    }

    this.particules.forEach(particules => particules.rendu());
  }
}
let confettis;

function setup() {
  createCanvas(windowWidth, windowHeight);
  frameRate(30);
  ancienne = createVector(0, 0);
  nouvelle = createVector(0, 0);
  confettis = new SystemeDeParticules(500, createVector(width / 2, -20));
}

function draw() {
  background(color("#111"));
  nouvelle.x = mouseX;
  nouvelle.y = mouseY;
  confettis.rendu();
  ancienne.x = nouvelle.x;
  ancienne.y = nouvelle.y;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  confettis.position = createVector(width / 2, -40);
}

function mousePressed() {
  pression = true;
}

function mouseReleased() {
  pression = false;
  confettis.gravite.y = 0.1;
  confettis.gravite.x = 0;
}
</script>


</body>
</html>
